name: build

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, shot: true, wrap: "xvfb-run -a -s '-screen 0 1280x720x24'" }
          # Arm runners are free for public repositories only.
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, shot: true }
          - { os: macos-latest, target: aarch64-apple-darwin }
          # Built on the Apple Silicon runner: tests would need an Intel Mac.
          - { os: macos-latest, target: x86_64-apple-darwin, no_test: true }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - run: cargo build --release --target ${{ matrix.target }}
      - run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --target ${{ matrix.target }}
        if: ${{ !matrix.no_test }}
      # A real screenshot where the runner has a screen (Xvfb, Windows' desktop).
      - run: sudo apt-get install -y xvfb
        if: ${{ matrix.shot && runner.os == 'Linux' }}
      - run: |
          ${{ matrix.wrap }} target/${{ matrix.target }}/release/screenrec shot shot.png
          test -s shot.png
        if: ${{ matrix.shot }}
