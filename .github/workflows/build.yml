name: build

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, shot: true, ocr: true, wrap: "xvfb-run -a -s '-screen 0 1280x720x24'" }
          # Arm runners are free for public repositories only.
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ocr: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, shot: true, ocr: true }
          - { os: macos-latest, target: aarch64-apple-darwin, ocr: true }
          # Built on the Apple Silicon runner; its tests (and the OCR's ONNX Runtime 1.23.2,
          # the last with an Intel build) run under Rosetta 2 when the runner has it.
          - { os: macos-latest, target: x86_64-apple-darwin, rosetta: true, ocr: true }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - run: cargo build --release --target ${{ matrix.target }}
      - run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --target ${{ matrix.target }}
        if: ${{ !matrix.rosetta }}
      - run: if arch -x86_64 /usr/bin/true; then cargo test --target ${{ matrix.target }}; else echo "::warning::no Rosetta 2 on this runner, x86_64 tests not run"; fi
        if: ${{ matrix.rosetta }}
      # A real screenshot where the runner has a screen (Xvfb, Windows' desktop).
      - run: sudo apt-get update && sudo apt-get install -y xvfb
        if: ${{ matrix.shot && runner.os == 'Linux' }}
      - run: |
          ${{ matrix.wrap }} target/${{ matrix.target }}/release/screenrec shot shot.png
          test -s shot.png
        if: ${{ matrix.shot }}
      # OCR: the runtime and the models download on first use into
      # screenrec's cache folder; keep them between runs.
      - uses: actions/cache@v4
        if: ${{ matrix.ocr }}
        with:
          path: |
            ~/.cache/screenrec
            ~/Library/Caches/screenrec
            ~/AppData/Local/screenrec
          key: ocr-${{ matrix.target }}-${{ hashFiles('src/**/*ocr*') }}
      # Known text in, the same text out: the runtime loads and the models read it, no screen needed.
      - run: cargo test --target ${{ matrix.target }} -- --ignored --test-threads 1 ocr
        if: ${{ matrix.ocr && !matrix.rosetta }}
      - run: if arch -x86_64 /usr/bin/true; then cargo test --target ${{ matrix.target }} -- --ignored --test-threads 1 ocr; else echo "::warning::no Rosetta 2 on this runner, x86_64 OCR not run"; fi
        if: ${{ matrix.ocr && matrix.rosetta }}
      # The real thing on a screen: shot --ocr, --ocr --clip, --clip, three at once, rec --ocr (Linux).
      - run: sudo apt-get install -y ffmpeg xclip fonts-ipafont-gothic
        if: ${{ matrix.ocr && matrix.shot && runner.os == 'Linux' }}
      - run: ${{ matrix.wrap }} bash .github/ocr-smoke.sh target/${{ matrix.target }}/release/screenrec ocr-smoke
        if: ${{ matrix.ocr && matrix.shot }}
      # Informational: the runner may not grant screen recording to the job.
      - run: bash .github/ocr-smoke.sh target/${{ matrix.target }}/release/screenrec ocr-smoke
        if: ${{ matrix.ocr && runner.os == 'macOS' && !matrix.rosetta }}
        continue-on-error: true
