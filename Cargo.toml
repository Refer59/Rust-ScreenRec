[package]
name = "rust-screenrec"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "screenrec"
path = "src/main.rs"

[dependencies]
jpeg-encoder = { version = "0.7", features = ["simd"] } # AVX2 DCT when the CPU has it, same bytes out
libc = "0.2"
png = "0.18"

# Capture, the launcher and its keyboard shortcut are X11 code.
[target.'cfg(target_os = "linux")'.dependencies]
ab_glyph = "0.2"
x11rb = { version = "0.14", features = ["composite", "damage", "randr", "shm", "xfixes", "xinput"] }
xkeysym = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
